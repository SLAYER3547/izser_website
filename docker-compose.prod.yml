services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 24.13.0-slim

    image: izser-website:latest

    container_name: izser-website

    restart: unless-stopped

    init: true

    read_only: true

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"

    ports:
      - "127.0.0.1:3001:3000"

    tmpfs:
      - /tmp

    volumes:
      - izser_website_next_cache:/app/.next/cache

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  izser_website_next_cache:
    name: izser_website_next_cache